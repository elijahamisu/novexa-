<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVEXA — Investor Dashboard</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --accent: #2563EB;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --gold: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --success: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 84px;
    }
    .header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0B1120;
      border-bottom: 1px solid var(--border);
    }
    .user-greeting {
      font-size: 14px;
      color: var(--text-muted);
    }
    .user-name {
      font-size: 16px;
      font-weight: 700;
      color: #FFF;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .icon-btn {
      background: #1E293B;
      color: #FFF;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }
    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }
    .balance-card {
      background: linear-gradient(135deg, #1E3A8A, #0F172A);
      border: 1px solid #3B82F6;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .balance-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93C5FD;
    }
    .balance-val {
      font-size: 32px;
      font-weight: 800;
      margin: 8px 0 18px 0;
      color: #FFFFFF;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-action {
      background: #FFFFFF;
      color: #0F172A;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-action-alt {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .stat-card-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-card-val {
      font-size: 18px;
      font-weight: 700;
      color: #FFF;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0B1120;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item.active {
      color: #60A5FA;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <div class="user-greeting">Investor Portal</div>
      <div class="user-name" id="user-display-name">Loading...</div>
    </div>
    <div class="header-actions">
      <a href="/notifications.html" class="icon-btn">Alerts</a>
      <button id="btn-logout" class="icon-btn">Exit</button>
    </div>
  </header>

  <main class="content">
    <div class="balance-card">
      <div class="balance-label">Total Available Balance</div>
      <div class="balance-val" id="wallet-balance">₦0.00</div>
      <div class="quick-actions">
        <a href="/deposit.html" class="btn-action">+ Deposit</a>
        <a href="/withdraw.html" class="btn-action-alt">Withdraw</a>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-title">Total Invested</div>
        <div class="stat-card-val" id="total-invested">₦0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Total Earned</div>
        <div class="stat-card-val" id="total-earned">₦0.00</div>
      </div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="/dashboard.html" class="nav-item active">Dashboard</a>
    <a href="/plans.html" class="nav-item">Plans</a>
    <a href="/investments.html" class="nav-item">Investments</a>
    <a href="/referrals.html" class="nav-item">Referrals</a>
    <a href="/profile.html" class="nav-item">Profile</a>
  </nav>

  <script type="module">
    import { supabase, formatNaira, showToast } from '/supabase-client.js';

    async function initDashboard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.replace('/login.html');
        return;
      }

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', session.user.id)
        .single();

      if (error || !profile) {
        showToast('Unable to load profile data', 'error');
        return;
      }

      document.getElementById('user-display-name').textContent = profile.full_name || 'Investor';
      document.getElementById('wallet-balance').textContent = formatNaira(profile.wallet_balance);
      document.getElementById('total-invested').textContent = formatNaira(profile.total_invested);
      document.getElementById('total-earned').textContent = formatNaira(profile.total_earned);
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.replace('/login.html');
    });

    initDashboard();
  </script>
</body>
</html>
