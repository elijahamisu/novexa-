<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVEXA — Investor Dashboard</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --accent: #2563EB;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --gold: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --success: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 84px;
    }
    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0B1120;
      border-bottom: 1px solid var(--border);
    }
    .brand-mini {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #FFFFFF, #93C5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .user-greeting {
      font-size: 12px;
      color: var(--text-muted);
    }
    .user-name {
      font-size: 15px;
      font-weight: 700;
      color: #FFF;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      background: #1E293B;
      color: #FFF;
      border: 1px solid #334155;
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .icon-btn:hover {
      background: #334155;
    }
    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px;
    }
    .balance-card {
      background: linear-gradient(135deg, #1E3A8A, #0F172A);
      border: 1px solid #3B82F6;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .balance-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93C5FD;
    }
    .balance-val {
      font-size: 32px;
      font-weight: 800;
      margin: 8px 0 18px 0;
      color: #FFFFFF;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-action {
      background: #FFFFFF;
      color: #0F172A;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-action-alt {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .ref-banner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ref-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ref-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .ref-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0B1120;
      border: 1px solid #1E293B;
      padding: 10px 14px;
      border-radius: 10px;
    }
    .ref-code {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #60A5FA;
    }
    .copy-btn {
      background: var(--accent);
      color: #FFF;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .stat-card-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-card-val {
      font-size: 18px;
      font-weight: 700;
      color: #FFF;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0B1120;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item.active {
      color: #60A5FA;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <div class="brand-mini">NOVEXA</div>
      <div class="user-greeting">Investor: <span id="user-display-name" class="user-name">Loading...</span></div>
    </div>
    <div class="header-actions">
      <a href="/notifications.html" class="icon-btn">Alerts</a>
      <button id="btn-logout" class="icon-btn">Exit</button>
    </div>
  </header>

  <main class="content">
    <div class="balance-card">
      <div class="balance-label">Total Available Balance</div>
      <div class="balance-val" id="wallet-balance">₦0.00</div>
      <div class="quick-actions">
        <a href="/deposit.html" class="btn-action">+ Deposit</a>
        <a href="/withdraw.html" class="btn-action-alt">Withdraw</a>
      </div>
    </div>

    <!-- Live Referral Card -->
    <div class="ref-banner">
      <div class="ref-header">
        <span class="ref-title">Your Referral Code (15% / 3% / 1%)</span>
      </div>
      <div class="ref-box">
        <span class="ref-code" id="my-ref-code">--------</span>
        <button class="copy-btn" id="btn-copy-ref">Copy Link</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-title">Total Invested</div>
        <div class="stat-card-val" id="total-invested">₦0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Total Earned</div>
        <div class="stat-card-val" id="total-earned">₦0.00</div>
      </div>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="/dashboard.html" class="nav-item active">Dashboard</a>
    <a href="/plans.html" class="nav-item">Plans</a>
    <a href="/investments.html" class="nav-item">Investments</a>
    <a href="/referrals.html" class="nav-item">Referrals</a>
    <a href="/profile.html" class="nav-item">Profile</a>
  </nav>

  <script type="module">
    import { requireAuth, logoutUser, formatNaira, showToast } from '/supabase-client.js';

    let userProfile = null;

    async function initDashboard() {
      const authResult = await requireAuth();
      if (!authResult) return;

      userProfile = authResult.profile;

      if (!userProfile) {
        showToast('Initializing profile...', 'info');
        return;
      }

      document.getElementById('user-display-name').textContent = userProfile.full_name || 'Investor';
      document.getElementById('wallet-balance').textContent = formatNaira(userProfile.wallet_balance);
      document.getElementById('total-invested').textContent = formatNaira(userProfile.total_invested);
      document.getElementById('total-earned').textContent = formatNaira(userProfile.total_earned);
      document.getElementById('my-ref-code').textContent = userProfile.referral_code;
    }

    document.getElementById('btn-copy-ref').addEventListener('click', () => {
      if (!userProfile || !userProfile.referral_code) return;
      const refUrl = `${window.location.origin}/register.html?ref=${userProfile.referral_code}`;
      navigator.clipboard.writeText(refUrl).then(() => {
        showToast('Referral link copied to clipboard!', 'success');
      }).catch(() => {
        showToast(`Code: ${userProfile.referral_code}`, 'info');
      });
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await logoutUser();
    });

    initDashboard();
  </script>
</body>
</html>
