<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NOVEXA — Redeem Gift Code</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --bg-elevated: #131E3A;
      --bg-surface: #0B1120;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --accent-cyan: #38BDF8;
      --gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: #1E293B;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: #3B82F6;
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 16px));
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }

    @media (min-width: 768px) {
      .app-container {
        padding: 0 24px;
      }
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(7, 11, 25, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 16px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #FFF;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFF 30%, #93C5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .redeem-card {
      background: linear-gradient(145deg, #101935 0%, #0F172A 100%);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      margin-bottom: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .redeem-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .redeem-title {
      font-size: 20px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 4px;
    }

    .redeem-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .code-input {
      width: 100%;
      background: #090E1F;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      color: #FFF;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .code-input:focus {
      border-color: var(--border-focus);
    }

    .btn-redeem {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #FFF;
      border: none;
      padding: 15px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: var(--transition);
    }

    .btn-redeem:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hist-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .empty-card {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 30px 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* Official NOVEXA Bottom Navigation (Standard) */
    .novexa-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    .nav-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      height: 64px;
      padding: 0 4px;
    }

    @media (min-width: 768px) {
      .novexa-bottom-nav {
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        width: 480px;
        border-radius: 20px;
        border: 1px solid #CBD5E1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding-bottom: 0;
      }
      .nav-bar-inner {
        height: 66px;
      }
    }

    .nav-tab-item {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-decoration: none;
      color: #64748B;
      cursor: pointer;
    }

    .nav-tab-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-tab-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-tab-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-tab-indicator {
      position: absolute;
      bottom: 6px;
      width: 22px;
      height: 3px;
      background: transparent;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="app-container">
      <div class="header-inner">
        <a href="/dashboard.html" class="brand-group">
          <div class="brand-icon">N</div>
          <span class="brand-name">NOVEXA</span>
        </a>
        <a href="/wallet.html" style="font-size:12px; color:#60A5FA; text-decoration:none; font-weight:700;">Wallet &rarr;</a>
      </div>
    </div>
  </header>

  <main class="app-container">
    <section class="redeem-card">
      <div class="redeem-icon">🎁</div>
      <h1 class="redeem-title">Redeem Gift Code</h1>
      <p class="redeem-subtitle">Enter an official promotional voucher code to credit reward capital instantly to your available balance.</p>

      <form id="gift-form">
        <input type="text" id="gift-code-input" class="code-input" placeholder="ENTER CODE" maxlength="24" autocomplete="off" required>
        <button type="submit" class="btn-redeem" id="btn-redeem">Claim Promotional Credit</button>
      </form>
    </section>

    <section>
      <div style="font-size:14px; font-weight:700; color:#FFF; margin-bottom:12px; text-transform:uppercase;">
        Your Redeemed Vouchers
      </div>
      <div id="redemptions-container">
        <div class="empty-card">Loading redemption records...</div>
      </div>
    </section>
  </main>

  <!-- Official 5-Tab Navigation (Neutral Active State) -->
  <nav class="novexa-bottom-nav" aria-label="Main Navigation">
    <div class="nav-bar-inner">
      <a href="/dashboard.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <span class="nav-tab-label">Home</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/plans.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <span class="nav-tab-label">Plans</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/wallet.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><circle cx="17" cy="15" r="1"></circle></svg>
        </div>
        <span class="nav-tab-label">Wallet</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/referrals.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <span class="nav-tab-label">Referrals</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/profile.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span class="nav-tab-label">Profile</span>
        <div class="nav-tab-indicator"></div>
      </a>
    </div>
  </nav>

  <script type="module">
    import { supabase, requireAuth, formatNaira, showToast } from '/supabase-client.js';

    let currentUserId = null;

    async function initGiftCodes() {
      const auth = await requireAuth();
      if (!auth) return;
      currentUserId = auth.user.id;

      loadRedemptions();
    }

    async function loadRedemptions() {
      const container = document.getElementById('redemptions-container');
      const { data, error } = await supabase
        .from('gift_code_redemptions')
        .select('*, gift_codes(code)')
        .eq('user_id', currentUserId)
        .order('redeemed_at', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = `<div class="empty-card">You have not redeemed any gift codes yet.</div>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(r => {
        const dateStr = new Date(r.redeemed_at).toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
        const codeDisplay = r.gift_codes?.code || 'GIFT-CODE';

        const row = document.createElement('div');
        row.className = 'hist-item';
        row.innerHTML = `
          <div>
            <div style="font-size:13px; font-weight:700; color:#FFF;">${codeDisplay}</div>
            <div style="font-size:11px; color:var(--text-muted);">${dateStr}</div>
          </div>
          <div style="font-size:14px; font-weight:800; color:var(--success);">
            +${formatNaira(r.amount)}
          </div>
        `;
        container.appendChild(row);
      });
    }

    document.getElementById('gift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-redeem');
      const input = document.getElementById('gift-code-input');
      const code = input.value.trim().toUpperCase();

      if (!code) return;

      btn.disabled = true;
      btn.textContent = 'Verifying Code...';

      try {
        const { data, error } = await supabase.rpc('redeem_gift_code', {
          p_code: code
        });

        if (error || !data || !data.success) {
          showToast(data?.message || error?.message || 'Invalid or expired gift code', 'error');
          btn.disabled = false;
          btn.textContent = 'Claim Promotional Credit';
          return;
        }

        showToast(`Redeemed! ${formatNaira(data.amount)} credited to your wallet.`, 'success');
        input.value = '';
        btn.disabled = false;
        btn.textContent = 'Claim Promotional Credit';
        loadRedemptions();
      } catch (err) {
        showToast('Network error redeeming code', 'error');
        btn.disabled = false;
        btn.textContent = 'Claim Promotional Credit';
      }
    });

    initGiftCodes();
  </script>
</body>
</html>
