<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVEXA — Sign In</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --gold: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --border-focus: #3B82F6;
      --input-bg: #0B1120;
      --danger: #EF4444;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .back-home:hover {
      color: #FFFFFF;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFFFFF, #93C5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .alert-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.4;
      display: none;
      animation: fadeIn 0.2s ease-out;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .form-input::placeholder {
      color: #475569;
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 4px;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-submit:active {
      transform: scale(0.985);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: #60A5FA;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="top-bar">
      <a href="/index.html" class="back-home">&larr; Return to Home</a>
    </div>

    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-title">NOVEXA</div>
        <p class="brand-subtitle">Sign in to your investor portfolio</p>
      </div>

      <div id="error-banner" class="alert-banner"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com" 
              required 
              autocomplete="email"
              inputmode="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pwd" id="toggle-pwd" tabindex="-1">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have a NOVEXA account? 
        <a href="/register.html">Create one</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, redirectIfAuthenticated, showToast } from '/supabase-client.js';

    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('toggle-pwd');
    const btnSubmit = document.getElementById('btn-submit');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.style.display = 'none';
    }

    function setLoading(isLoading) {
      btnSubmit.disabled = isLoading;
      if (isLoading) {
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Verifying...';
      } else {
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign In';
      }
    }

    // Check URL parameters for account status errors
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'suspended') {
      showError('Your account has been deactivated or suspended. Please contact NOVEXA compliance.');
    }

    // Redirect active authenticated user
    redirectIfAuthenticated();

    // Toggle password visibility
    togglePwdBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePwdBtn.textContent = isPassword ? 'Hide' : 'Show';
    });

    // Handle form submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both your email address and password.');
        return;
      }

      setLoading(true);

      try {
        const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (authErr) {
          let userMsg = 'Invalid email or password. Please verify your credentials.';
          if (authErr.message.toLowerCase().includes('email not confirmed')) {
            userMsg = 'Please verify your email address before signing in.';
          } else if (authErr.message.toLowerCase().includes('too many requests')) {
            userMsg = 'Too many failed login attempts. Please wait a few moments and try again.';
          }
          showError(userMsg);
          setLoading(false);
          return;
        }

        if (!authData.user) {
          showError('Unable to authenticate. Please try again.');
          setLoading(false);
          return;
        }

        // Query user profile to ensure account status is active
        const { data: profile, error: profErr } = await supabase
          .from('profiles')
          .select('is_active')
          .eq('id', authData.user.id)
          .single();

        if (profile && profile.is_active === false) {
          await supabase.auth.signOut();
          showError('Your account is currently disabled. Please contact customer support.');
          setLoading(false);
          return;
        }

        showToast('Signed in successfully', 'success');
        window.location.replace('/dashboard.html');
      } catch (err) {
        showError('A network error occurred. Please check your connection and try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
