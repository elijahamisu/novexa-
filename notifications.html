<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NOVEXA — System & Payout Alerts</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --bg-elevated: #131E3A;
      --bg-surface: #0B1120;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --accent-cyan: #38BDF8;
      --gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: #1E293B;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: #3B82F6;
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 16px));
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }

    @media (min-width: 768px) {
      .app-container {
        padding: 0 24px;
      }
    }

    /* Top Bar */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(7, 11, 25, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 16px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #FFF;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFF 30%, #93C5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-mark-all {
      background: transparent;
      border: none;
      color: #60A5FA;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Page Intro */
    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 4px;
    }

    .page-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    /* Filter Chips */
    .filter-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #090E1F;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 7px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: #FFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* Notifications List */
    .notif-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notif-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .notif-card.unread {
      border-color: rgba(59, 130, 246, 0.4);
      background: linear-gradient(180deg, #101935 0%, #0F172A 100%);
    }

    .unread-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
      margin-top: 5px;
      flex-shrink: 0;
    }

    .read-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
    }

    .notif-content {
      flex-grow: 1;
      min-width: 0;
    }

    .notif-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 3px;
    }

    .notif-card.unread .notif-title {
      color: #93C5FD;
    }

    .notif-message {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .notif-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Empty State */
    .empty-state {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 20px;
      text-align: center;
      margin-top: 10px;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 4px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Official NOVEXA Bottom Navigation (Standard) */
    .novexa-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    .nav-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      height: 64px;
      padding: 0 4px;
    }

    @media (min-width: 768px) {
      .novexa-bottom-nav {
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        width: 480px;
        border-radius: 20px;
        border: 1px solid #CBD5E1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding-bottom: 0;
      }
      .nav-bar-inner {
        height: 66px;
      }
    }

    .nav-tab-item {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-decoration: none;
      color: #64748B;
      cursor: pointer;
    }

    .nav-tab-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-tab-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-tab-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-tab-indicator {
      position: absolute;
      bottom: 6px;
      width: 22px;
      height: 3px;
      background: transparent;
      border-radius: 3px;
    }

    .nav-tab-item.active {
      color: #0F172A;
    }

    .nav-tab-item.active .nav-tab-icon svg {
      stroke: #2563EB;
      transform: translateY(-1px);
    }

    .nav-tab-item.active .nav-tab-label {
      color: #0F172A;
      font-weight: 700;
    }

    .nav-tab-item.active .nav-tab-indicator {
      background: #2563EB;
      width: 26px;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-header">
    <div class="app-container">
      <div class="header-inner">
        <a href="/dashboard.html" class="brand-group">
          <div class="brand-icon">N</div>
          <span class="brand-name">NOVEXA</span>
        </a>

        <button type="button" class="btn-mark-all" id="btn-mark-all">Mark all read</button>
      </div>
    </div>
  </header>

  <main class="app-container">
    <h1 class="page-title">Notifications</h1>
    <p class="page-desc">System records, deposit approvals, cashout updates, and yield alerts.</p>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all">All Alerts</button>
      <button class="tab-btn" data-filter="unread">Unread</button>
    </div>

    <!-- Notification Stack -->
    <div id="notif-container" class="notif-stack">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading Alerts...</div>
      </div>
    </div>
  </main>

  <!-- Official 5-Tab Navigation (Maintains 5 Items) -->
  <nav class="novexa-bottom-nav" aria-label="Main Navigation">
    <div class="nav-bar-inner">
      <a href="/dashboard.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <span class="nav-tab-label">Home</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/plans.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <span class="nav-tab-label">Plans</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/wallet.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><circle cx="17" cy="15" r="1"></circle></svg>
        </div>
        <span class="nav-tab-label">Wallet</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/referrals.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <span class="nav-tab-label">Referrals</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/profile.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span class="nav-tab-label">Profile</span>
        <div class="nav-tab-indicator"></div>
      </a>
    </div>
  </nav>

  <script type="module">
    import { supabase, requireAuth, showToast } from '/supabase-client.js';

    let allNotifs = [];
    let currentFilter = 'all';

    async function initNotifications() {
      const auth = await requireAuth();
      if (!auth) return;

      loadNotifications(auth.user.id);
    }

    async function loadNotifications(userId) {
      const container = document.getElementById('notif-container');

      try {
        const { data, error } = await supabase
          .from('notifications')
          .select('*')
          .eq('user_id', userId)
          .order('created_at', { ascending: false })
          .limit(40);

        if (error) {
          container.innerHTML = `<div class="empty-state"><div class="empty-title">Error Loading Notifications</div></div>`;
          return;
        }

        allNotifs = data || [];
        renderNotifications();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-title">Network Connection Issue</div></div>`;
      }
    }

    function renderNotifications() {
      const container = document.getElementById('notif-container');
      const filtered = allNotifs.filter(n => {
        if (currentFilter === 'unread') return !n.is_read;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✓</div>
            <div class="empty-title">You're All Caught Up</div>
            <p class="empty-desc">No ${currentFilter === 'unread' ? 'unread ' : ''}notifications at this time.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(n => {
        const timeStr = new Date(n.created_at).toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });

        const card = document.createElement('div');
        card.className = `notif-card ${n.is_read ? 'read' : 'unread'}`;
        card.innerHTML = `
          <div class="${n.is_read ? 'read-dot' : 'unread-dot'}"></div>
          <div class="notif-content">
            <div class="notif-title">${n.title}</div>
            <div class="notif-message">${n.message}</div>
            <div class="notif-time">${timeStr}</div>
          </div>
        `;

        // Click to toggle read
        card.addEventListener('click', async () => {
          if (!n.is_read) {
            await supabase.from('notifications').update({ is_read: true }).eq('id', n.id);
            n.is_read = true;
            card.classList.remove('unread');
            card.classList.add('read');
            card.querySelector('.unread-dot')?.classList.replace('unread-dot', 'read-dot');
          }
        });

        container.appendChild(card);
      });
    }

    // Mark All As Read
    document.getElementById('btn-mark-all').addEventListener('click', async () => {
      try {
        const { data, error } = await supabase.rpc('mark_all_notifications_read');
        if (!error) {
          allNotifs.forEach(n => { n.is_read = true; });
          renderNotifications();
          showToast('All notifications marked as read', 'success');
        }
      } catch (e) {
        showToast('Unable to mark notifications read.', 'error');
      }
    });

    // Filter Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderNotifications();
      });
    });

    initNotifications();
  </script>
</body>
</html>
