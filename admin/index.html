<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVEXA — Admin Management System</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --accent: #2563EB;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --gold: #F59E0B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .admin-title {
      font-size: 20px;
      font-weight: 800;
      color: #93C5FD;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .nav-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      color: #FFF;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-tile-name {
      font-size: 14px;
      font-weight: 700;
    }
    .nav-tile-desc {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="admin-title">NOVEXA Control Room</div>
      <a href="/dashboard.html" style="color:var(--text-muted); font-size:12px; text-decoration:none;">Exit to App</a>
    </header>

    <div class="nav-grid">
      <a href="/admin/users.html" class="nav-tile">
        <div class="nav-tile-name">Users</div>
        <div class="nav-tile-desc">Manage accounts & balances</div>
      </a>
      <a href="/admin/deposits.html" class="nav-tile">
        <div class="nav-tile-name">Deposits</div>
        <div class="nav-tile-desc">Approve manual payments</div>
      </a>
      <a href="/admin/withdrawals.html" class="nav-tile">
        <div class="nav-tile-name">Withdrawals</div>
        <div class="nav-tile-desc">Review cashout requests</div>
      </a>
      <a href="/admin/plans.html" class="nav-tile">
        <div class="nav-tile-name">Investment Plans</div>
        <div class="nav-tile-desc">Configure ROI & duration</div>
      </a>
      <a href="/admin/settings.html" class="nav-tile">
        <div class="nav-tile-name">Site Settings</div>
        <div class="nav-tile-desc">Configure Moniepoint account</div>
      </a>
      <a href="/admin/reports.html" class="nav-tile">
        <div class="nav-tile-name">Cron Logs & Reports</div>
        <div class="nav-tile-desc">Daily midnight yields</div>
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/supabase-client.js';

    // Verify admin access
    async function verifyAdmin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.replace('/admin/login.html');
        return;
      }
      const { data, error } = await supabase
        .from('admin_users')
        .select('role')
        .eq('id', session.user.id)
        .eq('is_active', true)
        .single();

      if (error || !data) {
        window.location.replace('/dashboard.html');
      }
    }
    verifyAdmin();
  </script>
</body>
</html>
