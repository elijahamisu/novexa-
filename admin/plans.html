<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NOVEXA Admin — Investment Plan Management</title>
  <style>
    :root {
      --bg-dark: #050814;
      --bg-card: #0A0F24;
      --bg-elevated: #101735;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-cyan: #38BDF8;
      --gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: #1E293B;
      --border-focus: #3B82F6;
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .admin-app {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Desktop Sidebar */
    .admin-sidebar {
      display: none;
      width: 250px;
      background: #080C1E;
      border-right: 1px solid var(--border);
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 900;
    }

    @media (min-width: 1024px) {
      .admin-sidebar {
        display: flex;
      }
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #FFF;
    }

    .brand-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFF;
    }

    .sidebar-menu {
      list-style: none;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .menu-link:hover, .menu-link.active {
      background: rgba(37, 99, 235, 0.15);
      color: #93C5FD;
    }

    /* Main Administration Content */
    .admin-main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .admin-top-nav {
      background: rgba(8, 12, 30, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 800;
    }

    .btn-mobile-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #FFF;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      cursor: pointer;
    }

    @media (min-width: 1024px) {
      .btn-mobile-toggle {
        display: none;
      }
    }

    .admin-content-body {
      padding: 20px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .page-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-heading {
      font-size: 22px;
      font-weight: 800;
      color: #FFF;
    }

    .btn-add-plan {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #FFF;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Plans Grid */
    .plans-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .plans-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {
      .plans-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .plan-card-admin {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .plan-card-admin.inactive {
      opacity: 0.65;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .pca-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .pca-name {
      font-size: 17px;
      font-weight: 800;
      color: #FFF;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .status-badge.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .pca-specs {
      background: #080C1E;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .pca-spec-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
    }

    .pca-spec-row strong {
      color: #FFF;
    }

    .pca-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-plan-action {
      flex: 1;
      background: #080C1E;
      border: 1px solid var(--border);
      color: #FFF;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-input {
      width: 100%;
      background: #050814;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      color: #FFF;
      outline: none;
    }

    .form-row-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="admin-app">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="brand-mark">N</div>
        <div class="brand-text">NOVEXA ADMIN</div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/admin/index.html" class="menu-link"><span>Dashboard</span></a></li>
        <li><a href="/admin/users.html" class="menu-link"><span>Users</span></a></li>
        <li><a href="/admin/plans.html" class="menu-link active"><span>Plans</span></a></li>
        <li><a href="/admin/investments.html" class="menu-link"><span>Investments</span></a></li>
        <li><a href="/admin/deposits.html" class="menu-link"><span>Deposits</span></a></li>
        <li><a href="/admin/withdrawals.html" class="menu-link"><span>Withdrawals</span></a></li>
        <li><a href="/admin/transactions.html" class="menu-link"><span>Transactions</span></a></li>
        <li><a href="/admin/referrals.html" class="menu-link"><span>Referrals</span></a></li>
        <li><a href="/admin/gift-codes.html" class="menu-link"><span>Gift Codes</span></a></li>
        <li><a href="/admin/notifications.html" class="menu-link"><span>Notifications</span></a></li>
        <li><a href="/admin/reports.html" class="menu-link"><span>Reports</span></a></li>
        <li><a href="/admin/settings.html" class="menu-link"><span>Settings</span></a></li>
      </ul>
    </aside>

    <div class="admin-main">
      <header class="admin-top-nav">
        <div style="font-size:15px; font-weight:700; color:#FFF;">Investment Plans</div>
        <button type="button" class="btn-add-plan" id="btn-open-create">+ Add New Plan</button>
      </header>

      <div class="admin-content-body">
        <div class="page-title-row">
          <div>
            <h1 class="page-heading">Configured Investment Portfolios</h1>
            <div style="font-size:12px; color:var(--text-secondary);" id="plans-count-label">Loading plans...</div>
          </div>
        </div>

        <div class="plans-grid" id="plans-container">
          <div style="text-align:center; padding:30px; color:var(--text-muted);">Loading plan tiers...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Plan Form Modal (Create / Edit) -->
  <div class="modal-overlay" id="plan-modal">
    <div class="modal-card">
      <h2 style="font-size:16px; font-weight:800; color:#FFF; margin-bottom:14px;" id="modal-plan-title">Create Investment Plan</h2>
      <form id="plan-form">
        <input type="hidden" id="plan-id">

        <div class="form-group">
          <label class="form-label" for="plan-name">Plan Name</label>
          <input type="text" id="plan-name" class="form-input" placeholder="e.g. NOVEXA STARTER" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="plan-tagline">Tagline</label>
          <input type="text" id="plan-tagline" class="form-input" placeholder="e.g. Daily Wealth Portfolio">
        </div>

        <div class="form-group">
          <label class="form-label" for="plan-desc">Description</label>
          <input type="text" id="plan-desc" class="form-input" placeholder="Short description of plan terms">
        </div>

        <div class="form-row-duo">
          <div class="form-group">
            <label class="form-label" for="plan-min">Minimum Amount (NGN)</label>
            <input type="number" id="plan-min" class="form-input" min="1000" step="100" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="plan-max">Maximum Amount (NGN)</label>
            <input type="number" id="plan-max" class="form-input" min="1000" step="100" required>
          </div>
        </div>

        <div class="form-row-duo">
          <div class="form-group">
            <label class="form-label" for="plan-roi">Daily ROI (%)</label>
            <input type="number" id="plan-roi" class="form-input" min="0.1" step="0.05" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="plan-duration">Duration (Days)</label>
            <input type="number" id="plan-duration" class="form-input" min="1" step="1" required>
          </div>
        </div>

        <div class="form-row-duo">
          <div class="form-group">
            <label class="form-label" for="plan-order">Display Order</label>
            <input type="number" id="plan-order" class="form-input" min="0" step="1" value="0">
          </div>
          <div class="form-group">
            <label class="form-label" for="plan-active">Status</label>
            <select id="plan-active" class="form-input">
              <option value="true">Active (Purchasable)</option>
              <option value="false">Inactive (Disabled)</option>
            </select>
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
          <button type="button" class="btn-plan-action" id="btn-close-plan-modal">Cancel</button>
          <button type="submit" class="btn-plan-action" style="background:var(--accent);">Save Plan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase, formatNaira, showToast } from '/supabase-client.js';

    let allPlans = [];

    async function initPlansManagement() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.replace('/admin/login.html'); return; }
      const { data: adminCheck } = await supabase.rpc('check_is_admin');
      if (!adminCheck || !adminCheck.is_admin) {
        await supabase.auth.signOut();
        window.location.replace('/admin/login.html');
        return;
      }

      loadPlans();
    }

    async function loadPlans() {
      const container = document.getElementById('plans-container');
      const { data: plans, error } = await supabase
        .from('plans')
        .select('*')
        .order('display_order', { ascending: true });

      if (error || !plans || plans.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); grid-column: 1/-1;">No investment plans configured yet.</div>`;
        document.getElementById('plans-count-label').textContent = '0 Plans';
        return;
      }

      allPlans = plans;
      document.getElementById('plans-count-label').textContent = `${plans.length} Configured Plan${plans.length === 1 ? '' : 's'}`;

      container.innerHTML = '';
      plans.forEach(p => {
        const card = document.createElement('div');
        card.className = `plan-card-admin ${p.is_active ? '' : 'inactive'}`;
        card.innerHTML = `
          <div class="pca-top">
            <div>
              <div class="pca-name">${p.name}</div>
              <div style="font-size:11px; color:var(--text-muted);">${p.tagline || 'Portfolio'}</div>
            </div>
            <span class="status-badge ${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Active' : 'Disabled'}</span>
          </div>

          <div class="pca-specs">
            <div class="pca-spec-row">
              <span>Daily Yield:</span>
              <strong style="color:var(--accent-cyan);">${p.daily_roi_percent}%</strong>
            </div>
            <div class="pca-spec-row">
              <span>Duration:</span>
              <strong>${p.duration_days} Days</strong>
            </div>
            <div class="pca-spec-row">
              <span>Total Calculated:</span>
              <strong>${(p.daily_roi_percent * p.duration_days).toFixed(1)}%</strong>
            </div>
            <div class="pca-spec-row">
              <span>Min Investment:</span>
              <strong>${formatNaira(p.minimum_amount)}</strong>
            </div>
            <div class="pca-spec-row">
              <span>Max Investment:</span>
              <strong>${formatNaira(p.maximum_amount)}</strong>
            </div>
          </div>

          <div class="pca-actions">
            <button type="button" class="btn-plan-action btn-edit-p" data-id="${p.id}">Edit</button>
            <button type="button" class="btn-plan-action btn-toggle-p" data-id="${p.id}" data-active="${p.is_active}">
              ${p.is_active ? 'Deactivate' : 'Activate'}
            </button>
            <button type="button" class="btn-plan-action btn-delete-p" data-id="${p.id}" style="color:#FCA5A5;">Archive</button>
          </div>
        `;
        container.appendChild(card);
      });

      attachCardListeners();
    }

    function attachCardListeners() {
      // Edit
      document.querySelectorAll('.btn-edit-p').forEach(b => {
        b.addEventListener('click', () => {
          const planId = b.getAttribute('data-id');
          const plan = allPlans.find(p => p.id === planId);
          if (!plan) return;

          document.getElementById('modal-plan-title').textContent = 'Edit Investment Plan';
          document.getElementById('plan-id').value = plan.id;
          document.getElementById('plan-name').value = plan.name;
          document.getElementById('plan-tagline').value = plan.tagline || '';
          document.getElementById('plan-desc').value = plan.description || '';
          document.getElementById('plan-min').value = plan.minimum_amount;
          document.getElementById('plan-max').value = plan.maximum_amount;
          document.getElementById('plan-roi').value = plan.daily_roi_percent;
          document.getElementById('plan-duration').value = plan.duration_days;
          document.getElementById('plan-order').value = plan.display_order || 0;
          document.getElementById('plan-active').value = String(plan.is_active);

          document.getElementById('plan-modal').style.display = 'flex';
        });
      });

      // Toggle status
      document.querySelectorAll('.btn-toggle-p').forEach(b => {
        b.addEventListener('click', async () => {
          const planId = b.getAttribute('data-id');
          const currentlyActive = b.getAttribute('data-active') === 'true';
          const { error } = await supabase
            .from('plans')
            .update({ is_active: !currentlyActive, updated_at: new Date().toISOString() })
            .eq('id', planId);

          if (error) {
            showToast('Unable to update plan status.', 'error');
          } else {
            showToast(`Plan ${currentlyActive ? 'deactivated' : 'activated'}.`, 'success');
            loadPlans();
          }
        });
      });

      // Archive / Safe Delete
      document.querySelectorAll('.btn-delete-p').forEach(b => {
        b.addEventListener('click', async () => {
          const planId = b.getAttribute('data-id');
          if (!confirm('Archive this plan? If contracts exist, it will be deactivated to protect historical accounting.')) return;

          const { data, error } = await supabase.rpc('admin_delete_or_archive_plan', { p_plan_id: planId });
          if (error || !data || !data.success) {
            showToast(data?.message || 'Error archiving plan.', 'error');
          } else {
            showToast(data.message, 'success');
            loadPlans();
          }
        });
      });
    }

    // Modal Form Logic
    const modal = document.getElementById('plan-modal');
    document.getElementById('btn-open-create').addEventListener('click', () => {
      document.getElementById('modal-plan-title').textContent = 'Create Investment Plan';
      document.getElementById('plan-form').reset();
      document.getElementById('plan-id').value = '';
      modal.style.display = 'flex';
    });

    document.getElementById('btn-close-plan-modal').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    document.getElementById('plan-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const planId = document.getElementById('plan-id').value;

      const payload = {
        name: document.getElementById('plan-name').value.trim(),
        tagline: document.getElementById('plan-tagline').value.trim() || null,
        description: document.getElementById('plan-desc').value.trim() || null,
        minimum_amount: parseFloat(document.getElementById('plan-min').value),
        maximum_amount: parseFloat(document.getElementById('plan-max').value),
        daily_roi_percent: parseFloat(document.getElementById('plan-roi').value),
        duration_days: parseInt(document.getElementById('plan-duration').value, 10),
        display_order: parseInt(document.getElementById('plan-order').value, 10) || 0,
        is_active: document.getElementById('plan-active').value === 'true',
        updated_at: new Date().toISOString()
      };

      if (payload.maximum_amount < payload.minimum_amount) {
        showToast('Maximum amount must be greater than or equal to minimum amount.', 'error');
        return;
      }

      if (planId) {
        // Update
        const { error } = await supabase.from('plans').update(payload).eq('id', planId);
        if (error) {
          showToast(error.message, 'error');
          return;
        }
        showToast('Plan updated successfully.', 'success');
      } else {
        // Insert (total_return_percent is calculated automatically by PostgreSQL GENERATED ALWAYS)
        const { error } = await supabase.from('plans').insert(payload);
        if (error) {
          showToast(error.message, 'error');
          return;
        }
        showToast('New investment plan published.', 'success');
      }

      modal.style.display = 'none';
      loadPlans();
    });

    initPlansManagement();
  </script>
</body>
</html>
