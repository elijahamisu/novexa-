<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NOVEXA — My Investments</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --bg-elevated: #131E3A;
      --bg-surface: #0B1120;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --accent-cyan: #38BDF8;
      --gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: #1E293B;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: #3B82F6;
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 16px));
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }

    @media (min-width: 768px) {
      .app-container {
        padding: 0 24px;
      }
    }

    /* Top Bar */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(7, 11, 25, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 16px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #FFF;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFF 30%, #93C5FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Page Title & Filter Tabs */
    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 12px;
    }

    .filter-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #090E1F;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn.active {
      background: var(--bg-card);
      color: #FFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Investment Cards */
    .inv-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .inv-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .inv-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .inv-card-name {
      font-size: 16px;
      font-weight: 800;
      color: #FFF;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.completed {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .inv-data-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #090E1F;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .inv-data-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .inv-data-val {
      font-size: 12px;
      font-weight: 700;
      color: #FFF;
    }

    .inv-progress-track {
      width: 100%;
      height: 6px;
      background: #1E293B;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .inv-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-cyan));
      border-radius: 10px;
    }

    .inv-dates-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Polished Empty State */
    .empty-state {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 20px;
      text-align: center;
      margin-top: 10px;
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .empty-state-title {
      font-size: 17px;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 320px;
      margin: 0 auto 16px auto;
    }

    .btn-explore {
      display: inline-block;
      background: var(--accent);
      color: #FFF;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    /* Official NOVEXA Bottom Navigation (Standard from Prompt 4) */
    .novexa-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    .nav-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      height: 64px;
      padding: 0 4px;
    }

    @media (min-width: 768px) {
      .novexa-bottom-nav {
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        width: 480px;
        border-radius: 20px;
        border: 1px solid #CBD5E1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding-bottom: 0;
      }
      .nav-bar-inner {
        height: 66px;
      }
    }

    .nav-tab-item {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-decoration: none;
      color: #64748B;
      cursor: pointer;
    }

    .nav-tab-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-tab-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-tab-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-tab-indicator {
      position: absolute;
      bottom: 6px;
      width: 22px;
      height: 3px;
      background: transparent;
      border-radius: 3px;
    }

    .nav-tab-item.active {
      color: #0F172A;
    }

    .nav-tab-item.active .nav-tab-icon svg {
      stroke: #2563EB;
      transform: translateY(-1px);
    }

    .nav-tab-item.active .nav-tab-label {
      color: #0F172A;
      font-weight: 700;
    }

    .nav-tab-item.active .nav-tab-indicator {
      background: #2563EB;
      width: 26px;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-header">
    <div class="app-container">
      <div class="header-inner">
        <a href="/dashboard.html" class="brand-group">
          <div class="brand-icon">N</div>
          <span class="brand-name">NOVEXA</span>
        </a>

        <a href="/plans.html" style="font-size:12px; color:#60A5FA; text-decoration:none; font-weight:700;">+ New Plan</a>
      </div>
    </div>
  </header>

  <main class="app-container">
    <h1 class="page-title">Portfolio Investments</h1>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Investments List -->
    <div id="investments-container" class="inv-stack">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <div class="empty-state-title">Loading Investments...</div>
      </div>
    </div>
  </main>

  <!-- Official 5-Tab Navigation (Plans Active) -->
  <nav class="novexa-bottom-nav" aria-label="Main Navigation">
    <div class="nav-bar-inner">
      <a href="/dashboard.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <span class="nav-tab-label">Home</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/plans.html" class="nav-tab-item active">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <span class="nav-tab-label">Plans</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/wallet.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><circle cx="17" cy="15" r="1"></circle></svg>
        </div>
        <span class="nav-tab-label">Wallet</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/referrals.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <span class="nav-tab-label">Referrals</span>
        <div class="nav-tab-indicator"></div>
      </a>

      <a href="/profile.html" class="nav-tab-item">
        <div class="nav-tab-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span class="nav-tab-label">Profile</span>
        <div class="nav-tab-indicator"></div>
      </a>
    </div>
  </nav>

  <script type="module">
    import { supabase, requireAuth, formatNaira } from '/supabase-client.js';

    let allInvestments = [];
    let currentFilter = 'all';

    async function loadUserInvestments() {
      const auth = await requireAuth();
      if (!auth) return;

      const { user } = auth;
      const container = document.getElementById('investments-container');

      try {
        const { data, error } = await supabase
          .from('investments')
          .select('*, plans(name)')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false });

        if (error) {
          container.innerHTML = `<div class="empty-state"><div class="empty-state-title">Error Loading Portfolio</div></div>`;
          return;
        }

        allInvestments = data || [];
        renderInvestments();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-title">Network Error</div></div>`;
      }
    }

    function renderInvestments() {
      const container = document.getElementById('investments-container');
      const filtered = allInvestments.filter(inv => {
        if (currentFilter === 'all') return true;
        return inv.status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📂</div>
            <div class="empty-state-title">No Investments Found</div>
            <p class="empty-state-desc">You currently have no ${currentFilter === 'all' ? '' : currentFilter} investment contracts.</p>
            <a href="/plans.html" class="btn-explore">Explore Available Plans</a>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(inv => {
        const planName = inv.plans?.name || 'Investment Plan';
        const totalDays = Number(inv.duration_days) || 1;
        const accruedDays = Number(inv.days_accrued) || 0;
        const remainingDays = Math.max(0, totalDays - accruedDays);
        const progressPct = Math.min(100, Math.round((accruedDays / totalDays) * 100));
        const statusClass = inv.status === 'active' ? 'active' : 'completed';

        const card = document.createElement('div');
        card.className = 'inv-card';
        card.innerHTML = `
          <div class="inv-card-top">
            <span class="inv-card-name">${planName}</span>
            <span class="status-badge ${statusClass}">${inv.status}</span>
          </div>

          <div class="inv-data-grid">
            <div>
              <div class="inv-data-label">Invested</div>
              <div class="inv-data-val">${formatNaira(inv.amount)}</div>
            </div>
            <div>
              <div class="inv-data-label">Daily Yield</div>
              <div class="inv-data-val" style="color:var(--accent-cyan);">${formatNaira(inv.daily_income)}</div>
            </div>
            <div>
              <div class="inv-data-label">Total Earned</div>
              <div class="inv-data-val">${formatNaira(inv.total_earned)}</div>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
            <span>Cycle: Day ${accruedDays} of ${totalDays}</span>
            <span>${progressPct}% Complete</span>
          </div>
          <div class="inv-progress-track">
            <div class="inv-progress-fill" style="width: ${progressPct}%;"></div>
          </div>

          <div class="inv-dates-row">
            <span>Started: ${inv.start_date}</span>
            <span>${inv.status === 'active' ? `${remainingDays} days remaining` : `Ended: ${inv.end_date}`}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filter Buttons Listener
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderInvestments();
      });
    });

    loadUserInvestments();
  </script>
</body>
</html>
