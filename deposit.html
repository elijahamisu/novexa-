<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVEXA — Fund Wallet</title>
  <style>
    :root {
      --bg-dark: #070B19;
      --bg-card: #0F172A;
      --accent: #2563EB;
      --gold: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E293B;
      --success: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }
    .wrapper {
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-back {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .bank-card {
      background: #0B1120;
      border: 1px solid #2563EB;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .bank-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .bank-row:last-child {
      margin-bottom: 0;
    }
    .bank-label {
      color: var(--text-muted);
    }
    .bank-val {
      font-weight: 700;
      color: #FFF;
      text-align: right;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      color: #FFF;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #FFF;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <a href="/dashboard.html" class="nav-back">&larr; Back to Dashboard</a>
    <h1 class="title">Manual Bank Deposit</h1>
    <p class="desc">Transfer your desired investment amount to the NOVEXA verified account below, then fill out the submission form.</p>

    <div class="bank-card">
      <div class="bank-row">
        <span class="bank-label">Bank Name:</span>
        <span class="bank-val" id="dep-bank">Loading...</span>
      </div>
      <div class="bank-row">
        <span class="bank-label">Account Number:</span>
        <span class="bank-val" id="dep-acc-num">Loading...</span>
      </div>
      <div class="bank-row">
        <span class="bank-label">Account Name:</span>
        <span class="bank-val" id="dep-acc-name">Loading...</span>
      </div>
    </div>

    <form id="deposit-form">
      <div class="form-group">
        <label>Amount (NGN)</label>
        <input type="number" id="amount" placeholder="e.g. 50000" min="1000" required>
      </div>

      <div class="form-group">
        <label>Sender Full Name / Depositor Name</label>
        <input type="text" id="sender_name" placeholder="Name on the sender account" required>
      </div>

      <div class="form-group">
        <label>Payment Reference / Transaction ID</label>
        <input type="text" id="reference" placeholder="Bank transaction reference" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Submit Deposit Request</button>
    </form>
  </div>

  <script type="module">
    import { supabase, getSiteSettings, showToast } from '/supabase-client.js';

    async function loadAccountDetails() {
      const settings = await getSiteSettings();
      const depAcc = settings.deposit_account || {
        bank: 'MONIEPOINT',
        account_number: '5318726919',
        account_name: 'IBILOLA OMOROYEKE ISHOLA'
      };

      document.getElementById('dep-bank').textContent = depAcc.bank;
      document.getElementById('dep-acc-num').textContent = depAcc.account_number;
      document.getElementById('dep-acc-name').textContent = depAcc.account_name;
    }

    document.getElementById('deposit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        showToast('Please login first', 'error');
        window.location.replace('/login.html');
        return;
      }

      const amount = parseFloat(document.getElementById('amount').value);
      const sender_name = document.getElementById('sender_name').value.trim();
      const reference = document.getElementById('reference').value.trim();

      const { error } = await supabase.from('deposits').insert({
        user_id: session.user.id,
        amount,
        sender_name,
        reference,
        status: 'pending'
      });

      if (error) {
        showToast(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Submit Deposit Request';
      } else {
        showToast('Deposit request submitted! Admin will verify.', 'success');
        setTimeout(() => window.location.replace('/dashboard.html'), 1500);
      }
    });

    loadAccountDetails();
  </script>
</body>
</html>
